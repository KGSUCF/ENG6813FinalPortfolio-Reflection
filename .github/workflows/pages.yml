name: Deploy portfolio to GitHub Pages

# Publishes the site whenever main changes. The first successful run also turns
# GitHub Pages on, so no manual Settings step is required.
#
# NOTE: this workflow requires the Pages source to be "GitHub Actions".
# If you instead enable Pages via Settings > Pages > Deploy from a branch,
# delete this file — the two approaches conflict and this one will fail.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Turns Pages on for this repository if it is not already enabled.
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # The site is plain static files at the repo root — nothing to build.
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
